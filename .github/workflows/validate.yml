name: Validate documentation and SMTP
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check PHP syntax
        run: |
          php -l docs.php
          php -l email_service.php
          php -l config/mail.example.php
          php -l tools/check-mail.php
          php -l tests/smtp_test.php
      - name: Test SMTP against local mock only
        run: php tests/smtp_test.php
      - name: Check documentation JavaScript
        run: node --check assets/api-docs.js
